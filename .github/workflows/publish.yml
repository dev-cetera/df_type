##.title~

# Publishes to pub.dev. Triggered by the push of a `v{X.Y.Z}` tag — the
# prod.yml workflow creates and pushes that tag using the `RELEASE_PAT`
# secret, which is required because tags pushed by the default GITHUB_TOKEN
# do NOT trigger downstream workflows.
#
# `workflow_dispatch` is also accepted as a manual last-resort, but pub.dev's
# OIDC check requires the trigger to be a tag push for the publish to be
# accepted, so the dispatch path will only succeed for diagnostics
# (e.g. running the test step) — the publish step itself will be rejected
# by pub.dev unless the run was triggered by an actual tag push.
#
# pub.dev's "Automated publishing" must be enabled with:
#   Repository:    <owner>/<repo>
#   Tag pattern:   v{{version}}

name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+\+*'     # v1.2.3+4
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for the OIDC token that authenticates pub.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      # Defensive re-test: the prod.yml workflow already gated on these, but
      # someone could have hand-tagged an arbitrary commit. We want a hard
      # guarantee that what we ship to pub.dev compiles and passes tests.
      - name: Static analysis
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      - name: Verify pubspec version matches tag
        run: |
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]+$//')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::pubspec version ($PUBSPEC_VERSION) does not match tag (v$TAG_VERSION)"
            exit 1
          fi
          echo "pubspec.yaml version matches tag: v${PUBSPEC_VERSION}"

      - name: Publish to pub.dev
        run: dart pub publish --force
